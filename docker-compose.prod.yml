# ═══════════════════════════════════════════════════════════════════════════════
# DESPLIEGUE EN PRODUCCIÓN — servidor 172.18.10.10
#
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias frente a docker-compose.yml (local, congelado):
#   - Nginx del contenedor se publica SOLO en el HOST:8083 (NO 80/443:
#     esos puertos los ocupa el Nginx maestro del servidor).
#   - El frontend se compila con VITE_BASE=/control_equipos/ para servirse
#     bajo https://apps.vanguardfresh.pe/control_equipos/
#   - El Nginx maestro del host enruta /control_equipos/ → 127.0.0.1:8083
# ═══════════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:18
    container_name: apilamiento-postgres
    restart: unless-stopped
    ports:
      - "6112:5432"
    environment:
      POSTGRES_DB: repo_control_equipos_apilamiento
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido en .env}
      TZ: America/Lima
    command: ["postgres", "-c", "timezone=America/Lima"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repo_control_equipos_apilamiento"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apilamiento-backend
    restart: unless-stopped
    ports:
      - "6111:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/repo_control_equipos_apilamiento
      QUARKUS_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido en .env}
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      OIDC_TENANT_ID: ${OIDC_TENANT_ID:?OIDC_TENANT_ID requerido en .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID requerido en .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET requerido en .env}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-https://apps.vanguardfresh.pe/control_equipos/api/v1/auth/callback}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-apkequiposapilamiento}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE: /control_equipos/
    container_name: apilamiento-nginx
    restart: unless-stopped
    ports:
      - "8083:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

volumes:
  postgres-data:
