# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN CONGELADA — NO MODIFICAR sin autorización del arquitecto
# Validada y funcionando en producción local. Ver AGENTS.md sección 13.
# ═══════════════════════════════════════════════════════════════════════════════

# ---- Datasource ----
# ⚠ La URL interna usa postgres:5432 (red Docker). NO cambiar a localhost:5433.
# Host:5433 es solo para clientes externos (VS Code, DBeaver, pgAdmin).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/repo_control_equipos_apilamiento}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/repo_control_equipos_apilamiento

# ---- Hibernate ORM ----
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# ---- Flyway ----
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.repair-on-migrate=true
%dev.quarkus.flyway.validate-on-migrate=false

# ---- HTTP ----
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# ---- CORS ----
quarkus.http.cors=true
# quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:5174
quarkus.http.cors.origins=http://localhost:3000,http://localhost:6108,http://localhost:6110,https://apps.vanguardfresh.pe
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,info

# ---- API ----
quarkus.resteasy-reactive.path=/api/v1
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger

# ---- Logging ----
quarkus.log.level=INFO
quarkus.log.category."com.apilamiento".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# ---- OIDC / Microsoft Entra ID ----
apilamiento.oidc.tenant-id=${OIDC_TENANT_ID}
apilamiento.oidc.client-id=${OIDC_CLIENT_ID}
apilamiento.oidc.client-secret=${OIDC_CLIENT_SECRET}
apilamiento.oidc.redirect-uri=${OIDC_REDIRECT_URI:http://localhost/api/v1/auth/callback}
%dev.apilamiento.oidc.redirect-uri=http://localhost/api/v1/auth/callback

# ---- JWT ----
mp.jwt.verify.publickey.location=/publickey.pem
mp.jwt.verify.issuer=https://apilamiento.internal
smallrye.jwt.sign.key.location=/privatekey.pem

# Auth login/callback paths are public (handled by @PermitAll in AuthResource)
# All other /api/v1/* endpoints require valid JWT (handled by @RolesAllowed)

# ---- App Config ----
app.timezone=America/Lima
app.api.version=v1
app.jwt.expiration=28800

# ---- File Upload ----
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.limits.max-body-size=10M

# ---- FCM / Notificaciones Push ----
app.fcm.project-id=${FCM_PROJECT_ID:apkequiposapilamiento}
app.fcm.service-account=${FCM_SERVICE_ACCOUNT:}

