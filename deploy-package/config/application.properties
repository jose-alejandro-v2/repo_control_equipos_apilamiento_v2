# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE PRODUCCIÓN — Servidor .24
# Copiar a: /opt/control-equipos/config/application.properties
# ═══════════════════════════════════════════════════════════════════════════════

# ---- Datasource ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/repo_control_equipos_apilamiento}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20

# ---- Hibernate ORM ----
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false

# ---- Flyway ----
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

# ---- HTTP ----
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# ---- CORS ----
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost,http://localhost:80}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,info

# ---- API ----
quarkus.resteasy-reactive.path=/api/v1
quarkus.swagger-ui.always-include=false

# ---- Logging ----
quarkus.log.level=INFO
quarkus.log.category."com.apilamiento".level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# ---- OIDC / Microsoft Entra ID ----
apilamiento.oidc.tenant-id=${OIDC_TENANT_ID}
apilamiento.oidc.client-id=${OIDC_CLIENT_ID}
apilamiento.oidc.client-secret=${OIDC_CLIENT_SECRET}
apilamiento.oidc.redirect-uri=${OIDC_REDIRECT_URI:http://localhost/api/v1/auth/callback}

# ---- JWT ----
mp.jwt.verify.publickey.location=/publickey.pem
mp.jwt.verify.issuer=https://apilamiento.internal
smallrye.jwt.sign.key.location=/privatekey.pem

# ---- App Config ----
app.timezone=America/Lima
app.api.version=v1
app.jwt.expiration=28800

# ---- File Upload ----
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.limits.max-body-size=10M

# ---- FCM / Notificaciones Push ----
app.fcm.project-id=${FCM_PROJECT_ID:apkequiposapilamiento}
app.fcm.service-account=${FCM_SERVICE_ACCOUNT:}
